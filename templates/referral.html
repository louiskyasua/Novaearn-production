{% extends "base.html" %}{% block content %}<div class="card"><h1>Referral</h1><p>Your referral code: <strong>{{ referral_code }}</strong></p><p class="muted">Share your registration link using your code.</p></div><h2>Your referrals</h2><div class="table"><table><tr><th>Name</th><th>Email</th><th>Date</th></tr>{% for r in referrals %}<tr><td>{{ r.name }}</td><td>{{ r.email }}</td><td>{{ r.created_at }}</td></tr>{% else %}<tr><td colspan="3">No referrals yet.</td></tr>{% endfor %}</table></div>{% endblock %}
