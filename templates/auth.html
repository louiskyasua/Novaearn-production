{% extends "base.html" %}{% block content %}<div class="card"><h1>{{ 'Create account' if mode == 'register' else 'Login' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if mode == 'register' %}<label>Name</label><input name="name" required maxlength="100">{% endif %}<label>Email</label><input type="email" name="email" required maxlength="254"><label>Password</label><input type="password" name="password" required minlength="8" maxlength="128">{% if mode == 'register' %}<label>Referral code (optional)</label><input name="ref" maxlength="50">{% endif %}<button type="submit">{{ 'Register' if mode == 'register' else 'Login' }}</button></form></div>{% endblock %}
