{% extends "base.html" %}{% block content %}<h1>Transactions</h1><div class="table"><table><tr><th>Type</th><th>Amount</th><th>Note</th><th>Date</th></tr>{% for t in items %}<tr><td>{{ t.kind }}</td><td>₦{{ '{:,}'.format(t.amount) }}</td><td>{{ t.note }}</td><td>{{ t.created_at }}</td></tr>{% else %}<tr><td colspan="4">No transactions.</td></tr>{% endfor %}</table></div>{% endblock %}
